name: compat

# The compatibility run (test/compat/run.mjs): the MCP servers people start most with npx, each
# built from npm and started in the cage. It needs the network to build the images and takes a
# while, so it runs weekly and by hand, not on every push.
on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cage each server and list its tools
        run: npm run compat
      - name: The table as the job summary
        if: ${{ always() && hashFiles('compat-out/compat.md') != '' }}
        run: cat compat-out/compat.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('compat-out/compat.json') != '' }}
        with:
          name: compat
          path: compat-out/
