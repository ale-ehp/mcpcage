name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the package and SBOM to the GitHub release
      id-token: write # npm trusted publishing; Sigstore signing for npm provenance and the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm stage needs npm 11.15.0 or later: every Node 24 from 24.18.0 bundles one, Node 22 bundles
      # npm 10. No registry-url: it only pointed npm at a token, and without it a failed OIDC exchange
      # stops npm stage publish with ENEEDAUTH instead of sending "${NODE_AUTH_TOKEN}" as a token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm sbom --sbom-format cyclonedx --omit dev > mcpcage.cdx.json
      - run: npm pack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: mcpcage-*.tgz
      # No npm token: npm trades the job's OIDC token for a short-lived one, as the trusted publisher
      # set on npmjs.com for this file allows. Staged, not published: npm serves the version, with its
      # provenance, only once a maintainer approves it with two-factor authentication, which this job
      # cannot do. --provenance stays explicit: on its own npm adds provenance only when it finds the
      # repository and the package public, else stages without.
      - name: Stage on npm with provenance, for the maintainer to approve
        run: npm stage publish --provenance --access public --json mcpcage-*.tgz > staged.json
      # npm's answer holds the stage id; `npm stage list mcpcage` shows it too.
      - name: Tell the maintainer how to approve the staged version
        run: |
          package=$(jq -r '.[].id' staged.json)
          stage_id=$(jq -r '.[].stageId // "<stage-id>"' staged.json)
          {
            echo "## $package is staged on npm, not published"
            echo
            echo "npm serves it only once a maintainer approves it with two-factor authentication."
            echo
            echo "1. Approve it on npmjs.com (account menu, **Staged Packages**, **Approve**)"
            echo "   or with \`npm stage approve $stage_id\`."
            echo "2. Check that \`npm view mcpcage dist-tags.latest\` prints ${package#*@}."
            echo "3. Publish the draft release: \`gh release edit $GITHUB_REF_NAME --draft=false\`."
            echo
            echo "Not to be released: \`npm stage reject $stage_id\`, and delete the draft release."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # GitHub keeps the provenance among the repository's attestations. Attached to the release as
      # <package>.sigstore.json it also travels with the package for `gh attestation verify --bundle`,
      # and it is where Scorecard's Signed-Releases check looks for a signature. The release stays a
      # draft until the maintainer has approved the version on npm: published, it would announce a
      # version npm does not serve yet, or never will if it is rejected.
      - name: Draft GitHub release with the package, its SBOM and its signed provenance
        run: |
          for package in mcpcage-*.tgz; do cp "$PROVENANCE" "$package.sigstore.json"; done
          gh release create "$GITHUB_REF_NAME" mcpcage-*.tgz mcpcage-*.tgz.sigstore.json mcpcage.cdx.json --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
